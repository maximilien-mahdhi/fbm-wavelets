[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbmwavelets"
version = "0.1.0"
description = "Fractional Brownian motion: generation, wavelet synthesis, Hurst estimation and Haar correlations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyWavelets>=1.4",
    "fbm>=0.3",
    "rich>=13",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/fbmwavelets"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
